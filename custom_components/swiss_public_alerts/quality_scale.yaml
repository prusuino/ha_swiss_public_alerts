rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration has no actions.
  appropriate-polling:
    status: done
    comment: The feed is polled at the configured interval (default 10 minutes, at least 1 minute).
  brands: done
  common-modules:
    status: done
    comment: api.py (Alertswiss), hazards.py (Natural Hazards Portal), entity.py and issues.py hold the shared pieces.
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: done
    comment: No requirements beyond Home Assistant's own aiohttp.
  docs-actions:
    status: exempt
    comment: No actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data:
    status: done
    comment: RuntimeData with the Alertswiss and hazards coordinators is entry.runtime_data.
  test-before-configure: done
  test-before-setup: done
  unique-config-entry:
    status: done
    comment: A single entry; the sources and the postal code are its options.

  # Silver
  action-exceptions:
    status: exempt
    comment: No actions.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: todo
  reauthentication-flow:
    status: exempt
    comment: The open feeds need no credentials.
  test-coverage: todo

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: Web services, nothing on the network to discover.
  discovery-update-info:
    status: exempt
    comment: No discovery.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: No devices; the data covers Switzerland.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: One device; alerts are map markers, not devices.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: todo
  entity-translations: done
  exception-translations: todo
  icon-translations: done
  reconfiguration-flow:
    status: exempt
    comment: Every setting is an option of the single entry (Configure).
  repair-issues: done
  stale-devices:
    status: exempt
    comment: One device.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: todo
